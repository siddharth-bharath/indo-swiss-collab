# Fly.io configuration for indoswisscollab FastAPI app
app = "indoswisscollab"

# Primary region: cdg (Paris) — equidistant from Swiss/Indian audiences.
# Alternatives: bom (Mumbai, closer to India), zrh (Zurich, closer to Switzerland).
# CDG provides reasonable latency to both and is Fly's most cost-effective EU region.
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  ISRD_DB_PATH = "/data/indo_swiss_research.duckdb"
  ISRD_RESULTS_PER_PAGE = "100"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[mounts]
  source = "isrd_data"
  destination = "/data"

[[vm]]
  # shared-cpu-1x with 1024MB: 1GB gives DuckDB room for mmap and internal buffers.
  # 512MB may suffice but will constrain concurrent requests. Monitor in production;
  # bump to 2048 if OOM or slowdowns occur.
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
